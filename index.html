<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Fylo data storage component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fylo.css">
</head>

<body>
    <main class="fylo">
        <div class="card logo-card">
            <img src="logo.svg" alt="Fylo Logo" class="fylo-logo">
            <div class="icons">
                <button aria-label="Documents">
                    <img src="icon-document.svg" alt="">
                </button>
                <button aria-label="Folder">
                    <img src="icon-folder.svg" alt="">
                </button>
                <button aria-label="Upload">
                    <img src="icon-upload.svg" alt="">
                </button>
            </div>
        </div>
        <div class="card storage-card">
            <p>You've used <strong>815 GB</strong> of your storage</p>
            <div class="bar">
                <div class="bar-fill"></div>
            </div>
            <div class="bar-labels">
                <span>0 GB</span>
                <span>1000 GB</span>
            </div>
            <div class="bubble">
                <span class="bubble-number">185</span>
                <span class="bubble-text">GB left</span>
            </div>
        </div>
    </main>
</body>

</html>
